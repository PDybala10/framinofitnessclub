# ---------- Caisse (cahier §5) ----------
[caisse]
modes_paiement    = ["Espèces", "Mobile Money", "Virement", "Carte bancaire", "Autre"]
operateurs_mobile = ["Orange Money", "MTN MoMo"]   # ⚠️
ecart_tolere      = 0                      # écart de caisse accepté sans alerte

# ---------- Listes de choix (cahier §2.1, §2.2, §3.1, §4.1, §5.1, §6.1) ----------
[listes]
objectifs_clients    = ["Perte de poids", "Prise de masse", "Remise en forme", "Autre"]
categories_produits  = ["Articles sportifs", "Boissons"]
categories_materiel  = ["Cardio", "Musculation", "Accessoires"]
categories_charges   = ["Charges fixes", "Entretien", "Provision / Réserve"]
sexe                 = ["Masculin", "Féminin"]
fonctions_personnel  = ["Administrateur", "Coach", "Caissier", "Agent d'entretien", "Autre"]
etats_materiel       = ["Neuf", "Bon", "À réparer", "Hors service"]
objets_paiement      = ["Inscription", "Abonnement", "Produit", "Service", "Personal Training", "Autre"]

# ---------- Alertes (cahier §7.2) ----------
[alertes]
abonnement_expire_dans_jours = 7
maintenance_dans_jours       = 7           # ⚠️
garantie_expire_dans_jours   = 30          # ⚠️
jour_paie_salaires           = 25          # ⚠️ jour du mois
charge_echeance_dans_jours   = 5           # ⚠️

# ---------- Sauvegarde (cahier §1.2) ----------
[sauvegarde]
heure_auto      = "22:00"                  # ⚠️
dossier         = "backups"
nombre_conserve = 30                       # ⚠️
