{% extends "base.html" %}

{% block title %}Connexion – Framino Fitness Club{% endblock %}

{% block anonymous %}
    <div class="w-full max-w-sm bg-white rounded-lg shadow p-8">
        <h1 class="text-xl font-bold text-center mb-6">Framino Fitness Club</h1>
        {% if form.errors %}
            <div class="mb-4 px-4 py-3 rounded border bg-red-50 border-red-300 text-red-800 text-sm">
                Identifiant ou mot de passe incorrect.
            </div>
        {% endif %}
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="id_username" class="block text-sm font-medium mb-1">Identifiant</label>
                <input type="text" name="username" id="id_username" required autofocus
                       class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="id_password" class="block text-sm font-medium mb-1">Mot de passe</label>
                <input type="password" name="password" id="id_password" required
                       class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 font-medium">
                Se connecter
            </button>
        </form>
    </div>
{% endblock %}
